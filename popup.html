<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 350px;
            height: 400px;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            background-color: #282a36;
            gap: 10px;
        }
        textarea {
            flex-grow: 1;
            font-family: monospace;
            font-size: 14px;
            background-color: #1e1f29;
            color: #f8f8f2;
            border: 1px solid #44475a;
            border-radius: 4px;
            padding: 10px;
            resize: none;
        }
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button {
            padding: 8px 16px;
            background-color: #bd93f9;
            color: #282a36;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #ff79c6; }
        #status {
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
<textarea id="raw-json" spellcheck="false"></textarea>
<div class="footer">
    <div id="status"></div>
    <button id="save-btn">Sauvegarder</button>
</div>
<script src="popup.js"></script>
</body>
</html>
